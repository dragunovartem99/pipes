name: CI

on:
    workflow_call:
        inputs:
            setup:
                description: 'Toolchain: "node", "go", "python" or "none"'
                type: string
                required: false
                default: "none"
            checks:
                description: 'JSON array of checks, e.g. `["lint", "test"]`. Each runs as `<runner> <check>` in its own job'
                type: string
                required: true
            runner:
                description: 'Command each check is passed to, e.g. "make" or "npm run"'
                type: string
                required: true
            install:
                description: "Shell command that installs extra tools, run after setup and before the checks, e.g. `sudo apt-get install -y shfmt` or a script. It can export env vars to later steps via $GITHUB_ENV"
                type: string
                required: false
            fetch-depth:
                description: "Commits to fetch; 0 for full history (e.g. when the build reads `git log`)"
                type: number
                required: false
                default: 1
            cache:
                description: "Newline-separated paths restored from the latest `deploy-vps` cache, e.g. generated images the build only re-renders when changed. Restore only: the deploy saves it"
                type: string
                required: false
        secrets:
            build-env:
                description: 'JSON object of env vars exposed to every check, e.g. {"API_URL":"https://api.example.com"}'
                required: false

jobs:
    ci:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                check: ${{ fromJSON(inputs.checks) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: ${{ inputs.fetch-depth }}

            - name: Setup Node
              if: inputs.setup == 'node'
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install Node dependencies
              if: inputs.setup == 'node'
              run: npm ci

            - name: Setup Go
              if: inputs.setup == 'go'
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
                  # Includes tools/go.sum, so tools pinned there (e.g. golangci-lint) are cached too
                  cache-dependency-path: "**/go.sum"

            # uv installs the Python version the project asks for, from
            # .python-version or requires-python.
            - name: Setup uv
              if: inputs.setup == 'python'
              uses: astral-sh/setup-uv@v6

            - name: Install Python dependencies
              if: inputs.setup == 'python'
              run: uv sync --locked

            - name: Install
              if: inputs.install != ''
              run: ${{ inputs.install }}

            - name: Restore cache
              if: inputs.cache != ''
              uses: actions/cache/restore@v6
              with:
                  path: ${{ inputs.cache }}
                  key: pipes-${{ github.sha }}
                  restore-keys: pipes-

            - name: Run check
              run: ${{ inputs.runner }} ${{ matrix.check }}
              env: ${{ fromJSON(secrets.build-env || '{}') }}
