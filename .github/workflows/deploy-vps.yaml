name: Deploy to VPS

on:
    workflow_call:
        inputs:
            strategy:
                description: '"checkout" resets the git checkout on the server to the pushed commit; "release" uploads into a fresh directory and atomically swaps a symlink to it'
                type: string
                required: false
                default: "checkout"
            setup:
                description: 'Toolchain for the build step: "node", "go" or "none"'
                type: string
                required: false
                default: "none"
            build:
                description: "Shell command run on the runner before uploading, e.g. `npm run build`"
                type: string
                required: false
            upload:
                description: 'Space-separated paths rsynced to the server. With "checkout" they keep their relative paths inside the checkout; with "release" they form the release, e.g. `dist/ Caddyfile deploy.sh`'
                type: string
                required: false
            url:
                description: "Public URL shown on the deployment"
                type: string
                required: false
            llvm-version:
                description: "Deprecated, use `before`. LLVM major (e.g. \"22\") to install clang, lld, clang-tidy, clang-format and the sanitizer runtimes from apt.llvm.org; exports CLANG=clang-<major>. Skipped when empty"
                type: string
                required: false
            before:
                description: "Shell command run after dependencies are installed and before the build, e.g. a toolchain install script. It can export env vars to later steps via $GITHUB_ENV"
                type: string
                required: false
            fetch-depth:
                description: "Commits to fetch; 0 for full history (e.g. when the build reads `git log`)"
                type: number
                required: false
                default: 1
            cache:
                description: "Newline-separated paths cached across deploys (and restored by `ci-node`), e.g. generated images the build only re-renders when changed"
                type: string
                required: false
        secrets:
            build-env:
                description: 'JSON object of env vars exposed to the build step, e.g. {"API_URL":"https://api.example.com"}'
                required: false
            VPS_HOST:
                required: true
            VPS_USER:
                required: true
            VPS_SSH_KEY:
                required: true
            VPS_PROJECT_PATH:
                required: true

# One deploy at a time: they share a directory on the server. A running deploy is left to finish.
concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: production
            url: ${{ inputs.url }}
        env:
            SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
            PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
            SSH: ssh -o StrictHostKeyChecking=accept-new
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: ${{ inputs.fetch-depth }}

            - name: Setup Node
              if: inputs.setup == 'node'
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              if: inputs.setup == 'node'
              run: npm ci

            - name: Setup Go
              if: inputs.setup == 'go'
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            # From apt.llvm.org rather than the runner's clang: pinning the major keeps
            # clang-format output identical to the version the repo was formatted with.
            - name: Install LLVM
              if: inputs.llvm-version != ''
              env:
                  LLVM: ${{ inputs.llvm-version }}
              run: |
                  set -eu
                  curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/llvm.asc > /dev/null
                  codename=$(lsb_release -cs)
                  echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" \
                      | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      "clang-$LLVM" "lld-$LLVM" "llvm-$LLVM" "clang-tidy-$LLVM" "clang-format-$LLVM" "libclang-rt-$LLVM-dev"
                  echo "CLANG=clang-$LLVM" >> "$GITHUB_ENV"

            - name: Before
              if: inputs.before != ''
              run: ${{ inputs.before }}

            # Keyed by commit so every deploy saves a fresh copy; restore-keys picks up the latest.
            - name: Cache
              if: inputs.cache != ''
              uses: actions/cache@v6
              with:
                  path: ${{ inputs.cache }}
                  key: pipes-${{ github.sha }}
                  restore-keys: pipes-

            - name: Build
              if: inputs.build != ''
              run: ${{ inputs.build }}
              env: ${{ fromJSON(secrets.build-env || '{}') }}

            - name: Setup SSH
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

            # The checkout on the server is a deploy target, never a place to commit from:
            # reset to the pushed commit so local drift can't block a deploy. Uploads should be
            # git-ignored (e.g. a prebuilt binary in bin/), so the reset leaves them alone.
            - name: Deploy checkout
              if: inputs.strategy == 'checkout'
              env:
                  UPLOAD: ${{ inputs.upload }}
              run: |
                  set -eu
                  if [ -n "$UPLOAD" ]; then
                      # shellcheck disable=SC2086 # UPLOAD is a space-separated path list
                      rsync -azR -e "$SSH" $UPLOAD "$SSH_TARGET:$PROJECT_PATH/"
                  fi
                  $SSH "$SSH_TARGET" "PROJECT_PATH='$PROJECT_PATH' SHA='$GITHUB_SHA' sh -s" <<'SCRIPT'
                  set -eu
                  cd "$PROJECT_PATH"
                  git fetch origin
                  git reset --hard "$SHA"
                  ./deploy.sh
                  SCRIPT

            # Each deploy is staged as its own release directory; unchanged files are hardlinked
            # against the live release. The live path is a symlink, and renaming a fresh symlink
            # over it is atomic, so the site never disappears mid-deploy. The previous releases
            # are removed once the new one is live.
            - name: Deploy release
              if: inputs.strategy == 'release'
              env:
                  UPLOAD: ${{ inputs.upload }}
              run: |
                  set -eu
                  release="$PROJECT_PATH-releases/$GITHUB_SHA"
                  $SSH "$SSH_TARGET" "mkdir -p '$release'"
                  # shellcheck disable=SC2086 # UPLOAD is a space-separated path list
                  rsync -az --delete --chmod=D755,F644 --link-dest="$PROJECT_PATH/" -e "$SSH" \
                      $UPLOAD "$SSH_TARGET:$release/"
                  $SSH "$SSH_TARGET" "PROJECT_PATH='$PROJECT_PATH' RELEASE='$release' sh -s" <<'SCRIPT'
                  set -eu
                  ln -sfn "$RELEASE" "$PROJECT_PATH.tmp"
                  mv -T "$PROJECT_PATH.tmp" "$PROJECT_PATH"
                  cd "$RELEASE"
                  if [ -f deploy.sh ]; then bash deploy.sh; fi
                  find "${RELEASE%/*}" -mindepth 1 -maxdepth 1 -type d ! -path "$RELEASE" -exec rm -rf {} +
                  SCRIPT
