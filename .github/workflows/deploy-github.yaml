name: Deploy to GitHub Pages

on:
    workflow_call:
        inputs:
            setup:
                description: 'Toolchain for the build step: "node", "go" or "none"'
                type: string
                required: false
                default: "none"
            build:
                description: "Shell command that builds the site, e.g. `npm run build`"
                type: string
                required: true
            dist-folder:
                description: "Dist folder"
                type: string
                required: true
        secrets:
            build-env:
                description: 'JSON object of env vars exposed to the build step, e.g. {"API_URL":"https://api.example.com"}'
                required: false

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node
              if: inputs.setup == 'node'
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              if: inputs.setup == 'node'
              run: npm ci

            - name: Setup Go
              if: inputs.setup == 'go'
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              run: ${{ inputs.build }}
              env: ${{ fromJSON(secrets.build-env || '{}') }}

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ${{ inputs.dist-folder }}

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
