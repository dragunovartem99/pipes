name: Deploy to GitHub Pages

on:
    workflow_call:
        inputs:
            setup:
                description: 'Toolchain for the build step: "node", "go", "python" or "none"'
                type: string
                required: false
                default: "none"
            build:
                description: "Shell command that builds the site, e.g. `npm run build`"
                type: string
                required: true
            dist-folder:
                description: "Folder the build writes the site to, e.g. `./dist`"
                type: string
                required: true
            install:
                description: "Shell command that installs extra tools, run after setup and before the build, e.g. `sudo apt-get install -y shfmt` or a script. It can export env vars to later steps via $GITHUB_ENV"
                type: string
                required: false
            fetch-depth:
                description: "Commits to fetch; 0 for full history (e.g. when the build reads `git log`)"
                type: number
                required: false
                default: 1
        secrets:
            build-env:
                description: 'JSON object of env vars exposed to the build step, e.g. {"API_URL":"https://api.example.com"}'
                required: false

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: ${{ inputs.fetch-depth }}

            - name: Setup Node
              if: inputs.setup == 'node'
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              if: inputs.setup == 'node'
              run: npm ci

            - name: Setup Go
              if: inputs.setup == 'go'
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
                  # Includes tools/go.sum, so tools pinned there (e.g. golangci-lint) are cached too
                  cache-dependency-path: "**/go.sum"

            # uv installs the Python version the project asks for, from
            # .python-version or requires-python.
            - name: Setup uv
              if: inputs.setup == 'python'
              uses: astral-sh/setup-uv@v6

            - name: Install Python dependencies
              if: inputs.setup == 'python'
              run: uv sync --locked

            - name: Install
              if: inputs.install != ''
              run: ${{ inputs.install }}

            - name: Build
              run: ${{ inputs.build }}
              env: ${{ fromJSON(secrets.build-env || '{}') }}

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ${{ inputs.dist-folder }}

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
