name: CI (Node)

on:
    workflow_call:
        inputs:
            checks:
                description: "JSON array of npm scripts to run"
                type: string
                required: false
                default: '["format:check", "types:check", "lint:check", "test"]'
            llvm-version:
                description: "LLVM major (e.g. \"22\") to install clang, lld, clang-tidy, clang-format and the sanitizer runtimes from apt.llvm.org; exports CLANG=clang-<major>. Skipped when empty"
                type: string
                required: false
            fetch-depth:
                description: "Commits to fetch; 0 for full history (e.g. when the build reads `git log`)"
                type: number
                required: false
                default: 1
            cache:
                description: "Newline-separated paths restored from the latest `deploy-vps` cache, e.g. generated images the build only re-renders when changed. Restore only: the deploy saves it"
                type: string
                required: false
        secrets:
            build-env:
                description: 'JSON object of env vars exposed to every check, e.g. {"API_URL":"https://api.example.com"}'
                required: false

jobs:
    ci:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                check: ${{ fromJSON(inputs.checks) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: ${{ inputs.fetch-depth }}

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # From apt.llvm.org rather than the runner's clang: pinning the major keeps
            # clang-format output identical to the version the repo was formatted with.
            - name: Install LLVM
              if: inputs.llvm-version != ''
              env:
                  LLVM: ${{ inputs.llvm-version }}
              run: |
                  set -eu
                  curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/llvm.asc > /dev/null
                  codename=$(lsb_release -cs)
                  echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" \
                      | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      "clang-$LLVM" "lld-$LLVM" "llvm-$LLVM" "clang-tidy-$LLVM" "clang-format-$LLVM" "libclang-rt-$LLVM-dev"
                  echo "CLANG=clang-$LLVM" >> "$GITHUB_ENV"

            - name: Restore cache
              if: inputs.cache != ''
              uses: actions/cache/restore@v6
              with:
                  path: ${{ inputs.cache }}
                  key: pipes-${{ github.sha }}
                  restore-keys: pipes-

            - name: Run check
              run: npm run ${{ matrix.check }}
              env: ${{ fromJSON(secrets.build-env || '{}') }}
