name: CI (Python)

on:
    workflow_call:
        inputs:
            checks:
                description: "JSON array of make targets to run"
                type: string
                required: false
                default: '["fmt-check", "lint", "test"]'

jobs:
    ci:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                check: ${{ fromJSON(inputs.checks) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            # uv installs the Python version the project asks for, from
            # .python-version or requires-python.
            - name: Setup uv
              uses: astral-sh/setup-uv@v6

            - name: Install dependencies
              run: uv sync --locked

            - name: Run check
              run: make ${{ matrix.check }}
